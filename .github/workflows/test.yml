name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter-checks:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
      # T3-CI-COVERAGE: floor set a few points below the measured baseline (~58.6% lines as of
      # 2026-08-09) as a regression gate, not an aspirational target — ratchet up as more
      # coverage is added, don't lower it to pass a failing PR.
      - uses: VeryGoodOpenSource/very_good_coverage@v3
        with:
          path: coverage/lcov.info
          min_coverage: 55

  functions-checks:
    name: Cloud Functions (tsc + jest + rules)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npx tsc --noEmit
      # --coverage enforces jest.config.js's coverageThreshold (T3-CI-COVERAGE) as a gate.
      - run: npm test -- --coverage
      - run: npm run test:rules
